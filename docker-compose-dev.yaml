services:
  # Images
  wordgames-app-image:
    image: wordgames-app-image:${IMAGE_TAG}
    build:
      context: .
      dockerfile: _project/py-slim.dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
        PIP_VERSION: ${PIP_VERSION}
        UV_VERSION: ${UV_VERSION}
        UID: ${UID:-10001}
        GUID: ${GUID:-10001}
        IS_PROD: "false"

  # Serivces
  wordgames-app:
    container_name: wordgames-app
    image: wordgames-app-image:${IMAGE_TAG}
    user: root
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_ENV: ${APP_ENV}
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_DEFAULT_SENDER: ${SMTP_DEFAULT_SENDER}
    command: uv run flask --app word_games run --debug --port=8000 --host=0.0.0.0
    ports:
      - 127.0.0.1:58127:8000
    volumes:
      - ./src:/opt/word_games/src:Z


  wordgames-app-dev-helper: &base-container
    hostname: wordgames-app-dev-helper
    image: wordgames-app-image:${IMAGE_TAG}
    user: root
    command: sleep infinity
    tty: true
    stdin_open: true
    environment:
      HISTFILE: "/opt/word_games/.bash_history"
      APP_ENV: ${APP_ENV}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_DEFAULT_SENDER: ${SMTP_DEFAULT_SENDER}
      SMTP_WEB_UI: ${SMTP_WEB_UI}
    volumes:
      - ./src:/opt/word_games/src:Z
      - ./tests:/opt/word_games/tests:Z
      - ./migration:/opt/word_games/migration:Z
      - ./alembic.ini:/opt/word_games/alembic.ini:Z
    # dev-only
      - ./.local/coverage:/opt/word_games/coverage:Z
      - ./.local/.bash_history:/opt/word_games/.bash_history:Z
      - ./playground:/opt/word_games/playground:Z


  wordgames-db:
    container_name: wordgames-db
    image: wordgames-db
    build:
      context: _project/postgres
      args:
        DATABASE_IMAGE: ${DATABASE_IMAGE}
    user: postgres
    environment: &db_env
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_user_password
      PGPORT: ${DATABASE_PORT}
      PGUSER: ${DATABASE_USER}  # Mute 'FATAL:  role "root" does not exist'
    volumes:
      - wordgames-db:/var/lib/postgresql/data
      # EXTREMELY IMPORTANT INIT:
      # https://www.crowdstrike.com/en-us/blog/securing-postgresql-from-cryptojacking-campaigns-in-kubernetes/
      - ./_project/postgres/config:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${DATABASE_PORT}:${DATABASE_PORT}"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      retries: 30
    restart: unless-stopped
    secrets:
      - db_user_password

  wordgames-smtp:
    container_name: wordgames-smtp
    image: ${DEV_SMTP_IMAGE}
    restart: unless-stopped
    volumes:
        - ./.local/smtp:/data
    ports:
      - "127.0.0.1:${SMTP_PORT}:${SMTP_PORT}"
      - "127.0.0.1:${SMTP_WEB_UI}:${SMTP_WEB_UI}"
    environment:
        MP_UI_BIND_ADDR: "0.0.0.0:${SMTP_WEB_UI}"
        MP_SMTP_BIND_ADDR: "0.0.0.0:${SMTP_PORT}"
        MP_MAX_MESSAGES: 5000
        MP_DATABASE: /data/mailpit.db
        MP_SMTP_AUTH_ACCEPT_ANY: 1
        MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Jobs
  start-project-services:
    container_name: start-project-services
    image: busybox
    command: "echo Project start successfully"
    depends_on:
      wordgames-app:
        condition: service_healthy
      wordgames-db:
        condition: service_healthy
      wordgames-smtp:
        condition: service_healthy

  start-tests-services:
    container_name: start-tests-services
    image: busybox
    command: ["sh", "-c", "echo DB is healthy"]
    depends_on:
      wordgames-db:
        condition: service_healthy
      wordgames-smtp:
        condition: service_healthy

networks:
  default:
    name: word_games

volumes:
  wordgames-db:
    name: wordgames-db

secrets:
  db_user_password:
    file: .secret/db_user_password
