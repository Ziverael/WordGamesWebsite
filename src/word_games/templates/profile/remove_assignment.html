{% extends "profile/base.html" %}
{% from "auth/macros.html" import render_errors %}

{% block css %}
{{super()}}
<link rel="stylesheet" href="{{ url_for('static', filename = 'css/forms.css') }}" type="text/css"/>
{% endblock %}


{% block content%}
<section class="glass-card hero">
    <h1>Remove assigment</h1>
    <p>
        <form action="" method="post" novalidate>
            {{ form.hidden_tag() }}
            <p>
                {{ form.task.label }}<br>
                {{ form.task() }}
                {{ render_errors(form.task) }}

            </p>
            <br>
            <p>{{ form.submit() }}</p>
        </form>
    </p>
</section>
{% endblock %}
