[project]
name = "word_games"
version = "0.1.0"
description = "<description>"
authors = [{name="ZiveRael", email="papeernscal@gmail.com"}]
readme = "README.md"
dependencies = [
    "ipykernel==6.31.0", # Vs-code extension bug https://stackoverflow.com/questions/79788502/jupyter-notebook-extension-visual-studio-code-stuck-connecting-to-kernel in 7.1.0
    "pydantic==2.13.4",
    "scalene==2.3.0",
    "flask==3.1.3",
    "alembic==1.18.4",
    "pydantic-settings==2.14.1",
    "flask-wtf==1.3.0",
    "flask-login==0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "pyjwt==2.13.0",
    "psycopg[binary,pool]>=3.3.4",
    "polyfactory>=3.3.0",
    "email-validator>=2.3.0",
    "resend==2.34.0",
    "flask-mail==0.10.0",
]
requires-python=">= 3.12, <3.13"

[tool.uv]
package = true


[dependency-groups]
dev = [
    "gunicorn==26.0.0",
    "mypy==2.1.0",
    "pdbpp==0.12.1",
    "pre-commit==4.6.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "types-wtforms==3.2.1.20260518",
    "ruff==0.15.17",
]

[project.scripts]
main = "word_games.main:app"

[tool.mypy]
python_version = "3.12"
files = ["word_games", "tests"]
ignore_missing_imports = true

plugins = [
    "pydantic.mypy",
]
exclude = [
]
warn_unused_configs = true
show_error_context = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
]
ignore_missing_imports = true



[tool.ruff]
target-version = "py312"
exclude = ["notebooks"]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
unfixable = ["F841"]
ignore = [ "ANN", "TD", "N803", "N805", "N806", "COM812", "ISC001", "E501", "D", "RUF002"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "D",
    "PLC0415", # Flask app is explicitly dynamic
    "E402", # Blueprint must be before modular imports
]
"src/word_games/extensions.py" = [
    "PLC0415", # Flask app is explicitly dynamic
]
"migration/*" = [
    "INP001",  #  File `migration/env.py` is part of an implicit namespace package. Add an `__init__.py`.
]
"tests/**/*.py" = [
    "ARG001",  # Unused function argument:
    "DTZ001",  # The use of `datetime.datetime()` without `tzinfo` argument is not allowed
    "EM101",   # Exception must not use a string literal, assign to variable first
    "FBT001",  # Boolean-typed positional argument in function definition
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison, consider replacing x with a constant variable
    "PT004",   # Fixture `x` does not return anything, add leading underscore
    "S101",    # Use of assert
    "SLF001",  # Private member accessed
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party"
]
lines-after-imports = 2
known-third-party = ["yaml"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-annotations]
# Configure type annotation requirements (PEP 484 compliance)
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-dummy-args = true
suppress-none-returning = true


[tool.pytest.ini_options]
junit_family = "xunit2"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = "tests"
filterwarnings = [
]

[tool.coverage.report]
skip_covered = true
skip_empty = true
exclude_lines = [# list of regexes
    "pragma: no cover",
    "^if __name__ == \"__main__\":",
    "@abstractmethod",
    "@abc.abstractmethod",
    '^\s+\.\.\.\s*$',
    '.*\): \.\.\.$',
    '^\s+pass\s*$',
    "^if TYPE_CHECKING:",
    "^if typing.TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["./src/word_games"]


[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/migration"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
