name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: CI
          POSTGRES_PASSWORD: ${{ secrets.db_password }}
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup dependencies
        run: uv sync --dev && touch DEV

      - name: Run lint
        run: |
          uv run ruff check . || ERROR=$?
          uv run ruff format --check . || ERROR=$?
          uv run mypy --incremental --show-error-codes --pretty . || ERROR=$?
          exit ${ERROR}


  build:
    name: Build (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Prevent dirty lockfile
        run: git diff --exit-code uv.lock

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --dev --lock

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python }}
          path: dist/
